<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="atrium's frontend app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="atrium">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>atrium</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.mjs" type="module"></script>
  <script type="module" src="pdf.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <div id="loading">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #121318;
      }

      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .spinner {
        animation: rotate 2.2s linear infinite;
        width: 44px;
        height: 44px;
      }

      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

      .path {
        stroke-dasharray: 1px, 113px;
        stroke-dashoffset: 0;
        transform-origin: center;
        animation: dash 1.333s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
        stroke: #4355b9;
        stroke-linecap: square;
      }

      @media (prefers-color-scheme: dark) {
        .path {
          stroke: #bac3ff;
        }
      }

      @keyframes dash {
        0% {
          stroke-dasharray: 1px, 113px;
          stroke-dashoffset: 0;
        }

        50% {
          stroke-dasharray: 84.8px, 113px;
          stroke-dashoffset: 0;
        }

        100% {
          stroke-dasharray: 1px, 113px;
          stroke-dashoffset: -112px;
        }
      }
    </style>
    <svg class="spinner" width="44px" height="44px" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
      <circle class="path" fill="none" stroke-width="4" cx="22" cy="22" r="18"></circle>
    </svg>
  </div>
</body>

</html>
